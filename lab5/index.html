<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №5 | Ajax Каталог</title>
    <!-- Підключення Bootstrap 5 для стилізації (дозволено умовою п. 1.2.2) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .category-card, .specials-card {
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .category-card:hover, .specials-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        }
        .product-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Верхня панель навігації -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">TechStore Ajax</a>
            <div class="navbar-nav ms-auto">
                <!-- Посилання «Додому» веде на саму сторінку (оновлює її) -->
                <a class="nav-link active" href="index.html">Додому (Home)</a>
                <!-- Посилання «Каталог» завантажує каталог без оновлення сторінки -->
                <a class="nav-link" href="#" id="catalog-link">Каталог (Catalog)</a>
            </div>
        </div>
    </nav>

    <!-- Головний контейнер для динамічного контенту (SPA) -->
    <main class="container mb-5">
        <div id="main-content"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
